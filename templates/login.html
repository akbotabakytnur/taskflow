
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
            background: #f4f7fb;
            color: #172033;
            display: flex;
            flex-direction: column;
        }

        nav {
            background: #fff;
            padding: 18px 6%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            flex-wrap: wrap;
            border-bottom: 1px solid #e7ebf3;
        }

        .brand {
            color: #2563eb;
            font-size: 24px;
            font-weight: 800;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .nav-links a {
            color: #64748b;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            padding: 10px 13px;
            border-radius: 9px;
        }

        .nav-links a:hover {
            color: #2563eb;
            background: #eff6ff;
        }

        .nav-links .register-link {
            background: #2563eb;
            color: white;
        }

        .nav-links .register-link:hover {
            background: #1d4ed8;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 45px 20px;
        }

        .form-container {
            width: 100%;
            max-width: 440px;
            background: #fff;
            border: 1px solid #e8edf5;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 12px 35px #1720330c;
        }

        .icon-box {
            width: 54px;
            height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #eff6ff;
            border-radius: 14px;
            font-size: 27px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 29px;
            letter-spacing: -0.7px;
            margin: 0 0 10px;
        }

        .subtitle {
            color: #7b879b;
            font-size: 14px;
            line-height: 1.6;
            margin: 0 0 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-size: 13px;
            font-weight: 700;
            color: #334155;
        }

        input {
            display: block;
            width: 100%;
            min-height: 47px;
            padding: 12px 14px;
            border: 1px solid #dce3ee;
            border-radius: 9px;
            background: #fff;
            color: #172033;
            font: inherit;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: #a0aabc;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px #3b82f61c;
        }

        button {
            width: 100%;
            margin-top: 6px;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #2563eb;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            opacity: 0.65;
            cursor: wait;
        }

        #message {
            display: none;
            margin-top: 20px;
            padding: 13px 14px;
            border-radius: 9px;
            font-size: 13px;
            line-height: 1.5;
        }

        #message.success {
            display: block;
            background: #ecfdf5;
            color: #047857;
        }

        #message.error {
            display: block;
            background: #fef2f2;
            color: #b91c1c;
        }

        .register-prompt {
            text-align: center;
            color: #7b879b;
            font-size: 13px;
            margin: 25px 0 0;
        }

        .register-prompt a {
            color: #2563eb;
            font-weight: 700;
            text-decoration: none;
        }

        .register-prompt a:hover {
            text-decoration: underline;
        }

        footer {
            text-align: center;
            color: #9aa4b5;
            font-size: 12px;
            padding: 22px 10px;
        }

        @media (max-width: 500px) {
            nav {
                padding: 16px 5%;
            }

            .nav-links {
                gap: 3px;
            }

            .nav-links a {
                padding: 8px;
                font-size: 12px;
            }

            .form-container {
                padding: 28px 22px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="/dashboard" class="brand">TaskFlow</a>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/my-requests">My Requests</a>
            <a href="/create-request">Create Request</a>
            <a href="/register" class="register-link">Register</a>
        </div>
    </nav>

    <main>
        <div class="form-container">

            <div class="icon-box">🔐</div>

            <h1>Welcome Back</h1>

            <p class="subtitle">
                Sign in to your TaskFlow account to manage your IT support requests.
            </p>

            <form id="loginForm">

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" id="loginButton">Sign In →</button>

            </form>

            <div id="message" role="status" aria-live="polite"></div>

            <p class="register-prompt">
                Don't have an account?
                <a href="/register">Create an account</a>
            </p>

        </div>
    </main>

    <footer>
        TaskFlow · IT Support Request Management System
    </footer>

    <script>
        const form = document.getElementById("loginForm");
        const message = document.getElementById("message");
        const loginButton = document.getElementById("loginButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const data = {
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            message.className = "";
            message.style.display = "none";

            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            try {
                const response = await fetch("/login", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (!response.ok) {
                    throw new Error(
                        result.message || result.error || "Login failed. Please try again."
                    );
                }

                if (result.message === "Login successful!") {
                    message.className = "success";
                    message.textContent = result.message;

                    setTimeout(() => {
                        window.location.href = "/dashboard";
                    }, 1000);
                } else {
                    message.className = "error";
                    message.textContent =
                        result.message || "Could not sign in. Please check your details.";
                }

            } catch (error) {
                message.className = "error";
                message.textContent =
                    error.message || "Could not connect to the server.";
            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Sign In →";
            }
        });
    </script>

</body>
</html>
