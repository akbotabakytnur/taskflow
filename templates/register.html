```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - TaskFlow</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fc;
            color: #1e293b;
            min-height: 100vh;
        }

        nav {
            background: white;
            padding: 18px 6%;
            display: flex;
            justify-content: space-between;

            box-shadow: 0 2px 10px rgba(30, 41, 59, 0.05);
        }

        .brand {
            font-size: 24px;
            font-weight: bold;
            color: #2563eb;
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        nav a {
            text-decoration: none;
            color: #64748b;
            font-size: 14px;
            font-weight: bold;
            transition: color 0.2s;
        }

        nav a:hover,
        nav a.active {
            color: #2563eb;
        }

        main {
            padding: 45px 20px;

        .form-container {
            background: white;
            max-width: 460px;

        }

        .icon {
            width: 58px;

            background: #dbeafe;
            border-radius: 16px;

            align-items: center;
            font-size: 28px;
            margin-bottom: 22px;
        }

        h1 {
            font-size: 28px;
            margin: 0 0 10px;
            color: #0f172a;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;

            margin-bottom: 28px;
        }

        label {
            display: block;
            margin: 18px 0 8px;

        input {
            width: 100%;
            padding: 13px 14px;

            border-radius: 9px;

            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.12);
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #1d4ed8;
        }

            background: #93aeea;

</head>

<body>

    <nav>
        <a href="/dashboard" class="brand">TaskFlow</a>

        <div class="nav-links">
            <a href="/dashboard">Dashboard</a>
            <a href="/my-requests">My Requests</a>
            <a href="/create-request">Create Request</a>
            <a href="/login">Login</a>
        </div>
    </nav>

    <main>
        <div class="form-container">

            <div class="icon">👤</div>

            <h1>Create Account</h1>
            <p class="subtitle">
                Join TaskFlow to create and manage your IT support requests.
            </p>

            <form id="registerForm">

                <label for="username">Username</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >

                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    autocomplete="email"
                    required
                >

                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    required
                >

                <button type="submit" id="registerButton">
                    Create Account
                </button>

            </form>

            <div id="message" role="status" aria-live="polite"></div>

            <p class="login-link">
                Already have an account?
                <a href="/login">Sign in</a>
            </p>

        </div>
    </main>

    <footer>
        TaskFlow — IT Support Request Management System
    </footer>

    <script>
        const form = document.getElementById("registerForm");
        const message = document.getElementById("message");
        const button = document.getElementById("registerButton");

        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            message.textContent = "";
            message.className = "";
            message.style.display = "none";
            button.disabled = true;
            button.textContent = "Creating account...";

            const data = {
                username: document.getElementById("username").value.trim(),
                email: document.getElementById("email").value.trim(),
                password: document.getElementById("password").value
            };

            try {
                const response = await fetch("/register", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                message.textContent =
                    result.message || "Registration could not be completed.";

                if (response.ok) {
                    message.className = "success";
                    form.reset();
                } else {
                    message.className = "error";
                }

                message.style.display = "block";

            } catch (error) {
                message.textContent =
                    "Could not connect to the server. Please try again.";
                message.className = "error";
                message.style.display = "block";
            } finally {
                button.disabled = false;
                button.textContent = "Create Account";
            }
        });
    </script>

</body>
</html>
